<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Column Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>My Flexbox Layout</h1>
        
        <div class="layout-container">
            <section class="column">
                <h2>Column 1</h2>
                <p>This is the first column. We are using CSS Flexbox to make these elements sit side by side.</p>
            </section>

            <section class="column">
                <h2>Column 2</h2>
                <p>This is the second column. Try resizing your browser window to see the background color change!</p>
            </section>
        </div>
    </main>
</body>
</html>
